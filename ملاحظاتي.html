<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ملاحظاتي</title>
<style>
:root{--bg:#f2f3f5;--panel:#fff;--tx:#1c1c1e;--mut:#6b7280;--ac:#2f6df6;--bd:#e3e5e8;--sh:0 4px 20px rgba(0,0,0,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--panel:#26272b;--tx:#f2f2f3;--mut:#9ca3af;--ac:#6c9bff;--bd:#383a40;--sh:0 4px 20px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#17181a;--panel:#26272b;--tx:#f2f2f3;--mut:#9ca3af;--ac:#6c9bff;--bd:#383a40;--sh:0 4px 20px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overscroll-behavior:none}
#app{display:flex;height:100%}
#side{width:260px;background:var(--panel);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;transition:margin .2s;flex-shrink:0}
#side.hide{margin-inline-start:-260px}
#side header{padding:14px;display:flex;gap:8px;align-items:center;font-weight:700}
#list{overflow:auto;flex:1;padding:0 8px 8px}
.it{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.it:hover{background:var(--bg)}.it.on{background:var(--ac);color:#fff}
.it small{opacity:.7;display:block;font-size:11px}
.it b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;display:block}
.it button{background:none;border:0;color:inherit;opacity:.6;cursor:pointer;font-size:16px}
#main{flex:1;position:relative;min-width:0}
#top{position:absolute;top:10px;inset-inline:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#title{flex:1;min-width:0;background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font:600 15px inherit;box-shadow:var(--sh)}
button.b{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:12px;height:40px;min-width:40px;padding:0 12px;font-size:15px;cursor:pointer;box-shadow:var(--sh);white-space:nowrap}
button.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.b:disabled{opacity:.35}
#wrap{position:absolute;inset:0;background:#fff;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#live{pointer-events:none}
#bar,#dbar{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;background:var(--panel);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:8px 10px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 16px);overflow-x:auto}
#bar .b,#dbar .b{box-shadow:none;border-radius:10px;height:38px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;flex-shrink:0}
.sw.on{outline:3px solid var(--ac);outline-offset:1px}
#bar input[type=range]{width:80px;accent-color:var(--ac)}
.sep{width:1px;height:24px;background:var(--bd);flex-shrink:0}
#dbar[hidden],#doc[hidden]{display:none}
#doc{position:absolute;inset:64px 0 0;overflow:auto;padding:18px max(16px,calc(50% - 380px)) 100px;background:var(--panel);outline:0;font-size:17px;line-height:1.7}#doc h2{margin:.6em 0 .2em}#doc input[type=checkbox]{width:18px;height:18px;vertical-align:middle;accent-color:var(--ac)}
button.b{transition:background .15s,transform .1s}#wrap{cursor:crosshair}
#bar{padding:6px 8px;gap:2px;border-radius:24px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(14px)}
.ib{width:42px;height:42px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;border:0!important;background:transparent!important;color:var(--mut);flex-shrink:0;border-radius:14px!important}
#bar .ib.on,#pshp .ib.on{background:var(--ac)!important;color:#fff}
.ib:active{transform:scale(.9)}
#cdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:block}
#pop,#pshp{position:absolute;z-index:6;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
#pop{width:320px;flex-direction:column;align-items:center}
#pop[hidden],#pshp[hidden],#more[hidden],#zb[hidden]{display:none}
#pv{border-radius:50%;flex-shrink:0}
#more{position:absolute;top:60px;inset-inline-end:10px;z-index:7;background:var(--panel);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:6px;display:flex;flex-direction:column;min-width:200px}
#more .b{box-shadow:none;border:0;background:transparent;height:42px;text-align:start;width:100%}
#more .b:hover{background:var(--bg)}
#zb{position:absolute;left:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;height:34px;min-width:0;font-size:12px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-16px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:14px}#toast.show{opacity:1;transform:translateX(-50%)}
 #settings{position:absolute;top:62px;inset-inline-end:10px;width:min(360px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;z-index:30;background:var(--panel);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:14px}
 #settings[hidden]{display:none}#settings h3{margin:4px 0 12px}#settings label{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:8px;margin:8px 0;font-size:13px}#settings input,#settings select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}#settings .row{display:flex;gap:8px;margin-top:12px}#settings .row .b{flex:1;box-shadow:none}
.sw{width:30px;height:30px}
#sbar{position:absolute;z-index:6;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}#sbar[hidden]{display:none}
@media(max-width:700px){.ib{width:38px;height:40px}}
@media(max-width:700px){#side{position:absolute;inset-block:0;inset-inline-start:0;z-index:20;box-shadow:var(--sh)}#bar input[type=range]{width:60px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="app">
 <aside id="side">
  <header><span style="flex:1">ملاحظاتي</span><button class="b" id="nnew">+ رسم</button><button class="b" id="ntxt">+ نص</button></header>
  <input id="q" placeholder="🔍 بحث" style="margin:0 8px 8px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)">
  <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 8px"></div>
  <input id="nf" hidden placeholder="اسم المجلد (استخدم / للتداخل، مثل: دراسة/رياضيات) ثم Enter" style="margin:0 8px 8px;padding:8px 10px;border-radius:10px;border:1px solid var(--ac);background:var(--bg);color:var(--tx)">
  <div id="list"></div>
  <div style="padding:8px;display:flex;gap:6px"><button class="b" id="bk" style="flex:1;font-size:12px">⬇ نسخ احتياطي</button><button class="b" id="rs" style="flex:1;font-size:12px">⬆ استعادة</button><input type="file" id="rf" accept=".json" hidden></div>
 </aside>
 <div id="main">
  <div id="top">
   <button class="b" id="tside">☰</button>
   <input id="title" placeholder="العنوان" autocomplete="off"><select id="fsel" class="b" style="max-width:96px;padding:0 6px"></select><input type="color" id="ncol" title="لون الغلاف" value="#2f6df6" style="width:36px;height:40px;border:0;padding:0;background:none">
   <button class="b" id="mic" title="إملاء صوتي">🎙</button><button class="b" id="pdfin" title="استيراد PDF">📄</button><input type="file" id="pf" accept="application/pdf" hidden>
   <button class="b" id="bgb" title="الخلفية والقوالب">▦</button>
   <button class="b" id="penonly" title="القلم فقط: الإصبع للتحريك">✋ إصبع=تحريك</button>
   <button class="b" id="th" title="الوضع الليلي">◐</button>
   <button class="b" id="exp">⬇ PNG</button>
   <button class="b" id="pdf">⬇ PDF</button>
  </div>
  <div id="wrap"><canvas id="base"></canvas><canvas id="live"></canvas></div>
  <div id="doc" contenteditable="true" dir="auto" hidden></div>
  <div id="dbar" hidden><button class="b" data-c="bold"><b>B</b></button><button class="b" data-c="italic"><i>I</i></button><button class="b" data-c="h2">H</button><button class="b" data-c="insertUnorderedList">•</button><button class="b" data-c="ck">☑</button></div>
  <div id="bar">
   <button class="b on" data-t="pen">✎ قلم</button>
   <button class="b" data-t="fp">🖋 حبر</button><button class="b" data-t="pc">✏ رصاص</button><button class="b" data-t="br">🖌 فرشاة</button>
   <button class="b" data-t="hl">▮ ماركر</button>
   <button class="b" data-t="er">⌫ ممحاة</button><button class="b" data-t="ea">⌫ جزئية</button>
   <button class="b" data-t="ls">⬚ تحديد</button>
   <span class="sep"></span>
   <button class="b" data-t="ln">╱</button><button class="b" data-t="ar">➝</button><button class="b" data-t="rc">▭</button><button class="b" data-t="ci">◯</button>
   <button class="b" data-t="tx">T نص</button>
   <button class="b" id="img">🖼 صورة</button><input type="file" id="file" accept="image/*" hidden>
   <button class="b" id="ocr" title="تحويل الخط اليدوي إلى نص">Aa</button>
   <span class="sep"></span>
   <div id="sws" style="display:flex;gap:6px"></div><input type="color" id="cp" value="#111111" style="width:30px;height:30px;border:0;padding:0;background:none;flex-shrink:0">
   <span class="sep"></span>
   <input type="range" id="sz" min="1" max="24" value="3">
   <span class="sep"></span>
   <button class="b" id="undo">↶</button>
   <button class="b" id="redo">↷</button>
   <button class="b" id="clr">🗑</button>
  </div>
 </div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const base=$('#base'),live=$('#live'),wrap=$('#wrap');
const bx=base.getContext('2d',{desynchronized:true}),lx=live.getContext('2d',{desynchronized:true});
const COLORS=['#111111','#e53935','#1e66f5','#2e9e4f','#f59e0b','#8e44ad','#ec4899','#0ea5a4','#92400e','#64748b'];
const BGS=['blank','lines','grid','dots','cornell','weekly','music','page'];
let dpr=1,W=0,H=0;
let S={folders:[],notes:[],cur:null,tool:'pen',color:COLORS[0],size:3,penOnly:false,smooth:55,pressure:1,presets:[],sync:null,ocrIndex:{}};
let undo=[],redo=[],drawing=null,pan=null,erasing=false,needR=false,tp=new Map(),pz=null,sel=null,mv=null,lasso=null,xm=null;

function load(){try{const d=JSON.parse(localStorage.getItem('notes-v1'));if(d&&d.notes)Object.assign(S,{folders:d.folders||[],notes:d.notes,cur:d.cur,color:d.color||S.color,size:d.size||S.size,penOnly:d.penOnly===true})}catch(e){}
 if(!S.notes.length)mk();if(!S.notes.find(n=>n.id===S.cur))S.cur=S.notes[0].id}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('notes-v1',JSON.stringify({folders:S.folders,notes:S.notes,cur:S.cur,color:S.color,size:S.size,penOnly:S.penOnly}))}catch(e){}},400)}
function mk(){const n={id:Date.now()+''+Math.random().toString(36).slice(2,5),title:'',strokes:[],bg:'lines',ox:0,oy:0,t:Date.now()};S.notes.unshift(n);S.cur=n.id;return n}
const N=()=>S.notes.find(n=>n.id===S.cur);

function size(){dpr=window.devicePixelRatio||1;const r=wrap.getBoundingClientRect();W=r.width;H=r.height;for(const c of[base,live]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}render()}
function R(){if(!needR){needR=true;requestAnimationFrame(()=>{needR=false;render()})}}

function bbox(s){if(s.bb)return s.bb;if(s.k==='t'){const L=s.txt.split('\n'),f=Math.max(16,s.w*6);return s.bb=[s.p[0]-4,s.p[1]-4,s.p[0]+Math.max(...L.map(x=>x.length))*f*.62+8,s.p[1]+L.length*f*1.3+8]}if(s.k==='i')return s.bb=[s.p[0],s.p[1],s.p[0]+s.iw,s.p[1]+s.ih];let a=1e9,b=1e9,c=-1e9,d=-1e9;const p=s.p;for(let i=0;i<p.length;i+=3){a=Math.min(a,p[i]);c=Math.max(c,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1])}const m=s.w*2+2;return s.bb=[a-m,b-m,c+m,d+m]}
function paper(ctx,n){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#dfe3ea';ctx.fillStyle='#cfd5df';ctx.lineWidth=1;const Z=n.z||1,g=32*Z,ox=n.ox*Z,oy=n.oy*Z;
 if(n.bg==='lines'||n.bg==='grid'){ctx.beginPath();for(let y=-(((oy%g)+g)%g);y<H;y+=g){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}
  if(n.bg==='grid')for(let x=-(((ox%g)+g)%g);x<W;x+=g){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}ctx.stroke()}
 else if(n.bg==='dots'){for(let y=-(((oy%g)+g)%g);y<H;y+=g)for(let x=-(((ox%g)+g)%g);x<W;x+=g)ctx.fillRect(x-1,y-1,2,2)}}
function pressure(p){p=Math.max(0,Math.min(1,p));const v=S.pressure||1;return Math.pow(p,1/v)}
function wd(s,p){const tilt=S.tilt||1;return s.k==='h'?s.w*4:s.k==='b'?s.w*(.3+pressure(p)*3.2):s.k==='c'?s.w*.6:s.w*(.4+pressure(p)*1.1)*tilt}
function dot(ctx,s){const p=s.p;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(p[0],p[1],wd(s,p[2])/2,0,7);ctx.fill()}
function seg(ctx,s,i){const p=s.p,j=i*3,a=j-3;const sx=i===1?p[0]:(p[a-3]+p[a])/2,sy=i===1?p[1]:(p[a-2]+p[a+1])/2;
 const ex=(p[a]+p[j])/2,ey=(p[a+1]+p[j+1])/2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(p[a],p[a+1],ex,ey);ctx.lineWidth=s.k==='f'?s.w*(.3+Math.abs(Math.sin(Math.atan2(ey-sy,ex-sx)+.8))*1.5)*(.6+(p[a+2]+p[j+2])/2*.8):wd(s,(p[a+2]+p[j+2])/2);if(s.k==='c')ctx.globalAlpha=.7;ctx.stroke();ctx.globalAlpha=1}
function full(ctx,s,dx,dy){const p=s.p,n=p.length/3;ctx.save();ctx.translate(-dx,-dy);ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle=s.c;
 if(s.k==='t'){ctx.fillStyle=s.c;const f=Math.max(16,s.w*6);ctx.font=f+'px system-ui,Tahoma,Arial';if(s.r){ctx.translate(p[0],p[1]);ctx.rotate(s.r);ctx.translate(-p[0],-p[1])}ctx.textBaseline='top';ctx.direction='ltr';ctx.textAlign='left';s.txt.split('\n').forEach((l,i)=>ctx.fillText(l,p[0]+2,p[1]+2+i*f*1.3))}else if(s.k==='i'){const i=img(s);if(i.complete&&i.naturalWidth){if(s.r){const cx=p[0]+s.iw/2,cy=p[1]+s.ih/2;ctx.translate(cx,cy);ctx.rotate(s.r);ctx.translate(-cx,-cy)}ctx.drawImage(i,p[0],p[1],s.iw,s.ih)}}else if(s.k==='s'){if(n>1){const x0=p[0],y0=p[1],x1=p[3],y1=p[4];ctx.lineWidth=s.w;ctx.beginPath();if(s.sh==='rc')ctx.rect(x0,y0,x1-x0,y1-y0);else if(s.sh==='tr'){ctx.moveTo((x0+x1)/2,y0);ctx.lineTo(x1,y1);ctx.lineTo(x0,y1);ctx.closePath()}else if(s.sh==='ci')ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);else{ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);if(s.sh==='ar'){const a=Math.atan2(y1-y0,x1-x0),h=12+s.w*2;ctx.moveTo(x1,y1);ctx.lineTo(x1-h*Math.cos(a-.5),y1-h*Math.sin(a-.5));ctx.moveTo(x1,y1);ctx.lineTo(x1-h*Math.cos(a+.5),y1-h*Math.sin(a+.5))}}ctx.stroke()}}else if(n<2){dot(ctx,s)}else if(s.k==='h'){ctx.globalAlpha=.35;ctx.lineWidth=s.w*4;ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=1;i<n-1;i++){ctx.quadraticCurveTo(p[i*3],p[i*3+1],(p[i*3]+p[i*3+3])/2,(p[i*3+1]+p[i*3+4])/2)}ctx.lineTo(p[n*3-3],p[n*3-2]);ctx.stroke()}
 else{for(let i=1;i<n;i++)seg(ctx,s,i);ctx.beginPath();ctx.moveTo((p[n*3-6]+p[n*3-3])/2,(p[n*3-5]+p[n*3-2])/2);ctx.lineTo(p[n*3-3],p[n*3-2]);ctx.lineWidth=wd(s,p[n*3-1]);ctx.stroke()}
 ctx.restore()}
function render(){const n=N();zb(n);sb();bx.setTransform(dpr,0,0,dpr,0,0);paper(bx,n);tpl(bx,n);const Z=n.z||1;bx.save();bx.setTransform(dpr*Z,0,0,dpr*Z,0,0);
 for(const s of n.strokes){const b=bbox(s);if(b[2]<n.ox||b[0]>n.ox+W/Z||b[3]<n.oy||b[1]>n.oy+H/Z)continue;full(bx,s,n.ox,n.oy)}if(sel){const b=selBB();bx.translate(-n.ox,-n.oy);bx.strokeStyle='#2f6df6';bx.lineWidth=1.5/Z;bx.setLineDash([6/Z,4/Z]);bx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);bx.setLineDash([]);bx.fillStyle='#fff';bx.lineWidth=2/Z;const rx=(b[0]+b[2])/2,ry=b[1]-30/Z;bx.beginPath();bx.moveTo(rx,b[1]);bx.lineTo(rx,ry);bx.stroke();for(const[hx,hy]of[[rx,ry],[b[2],b[3]]]){bx.beginPath();bx.arc(hx,hy,9/Z,0,7);bx.fill();bx.stroke()}}bx.restore()}

function pt(e){const n=N(),r=wrap.getBoundingClientRect();let p=e.pointerType==='mouse'?.5:(e.pressure||.5);if(e.pointerType==='pen'&&p===0)p=.5;
 if(e.pointerType==='pen'){const tx=e.tiltX||0,ty=e.tiltY||0;S.tilt=1-Math.min(40,Math.hypot(tx,ty))/160}else S.tilt=1;
 const Z=n.z||1;return[(e.clientX-r.left)/Z+n.ox,(e.clientY-r.top)/Z+n.oy,Math.round(p*100)/100]}
function tool(e){return(e.buttons&32)||(e.pointerType==='pen'&&e.button===5)?'er':S.tool}

wrap.addEventListener('pointerdown',e=>{
 if(document.activeElement.tagName==='TEXTAREA')document.activeElement.blur();
 if(e.pointerType==='pen'&&!S.penOnly){S.penOnly=true;po();save()}
 if(e.pointerType==='touch'){tp.set(e.pointerId,{x:e.clientX,y:e.clientY});wrap.setPointerCapture(e.pointerId);if(tp.size>=2){pan=null;if(drawing){clearTimeout(drawing.tm);drawing=null;lx.clearRect(0,0,1e5,1e5);live.style.opacity=1;R()}const[a,b]=[...tp.values()],n=N(),r=wrap.getBoundingClientRect();pz={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:n.z||1,wx:0,wy:0};pz.wx=((a.x+b.x)/2-r.left)/pz.z+n.ox;pz.wy=((a.y+b.y)/2-r.top)/pz.z+n.oy;return}if(S.penOnly){pan={x:e.clientX,y:e.clientY,id:e.pointerId};return}}

function xapply(m,a){const c=m.c,co=Math.cos(a),si=Math.sin(a);for(const o of m.o){const s=o.s,P=o.p;for(let i=0;i<P.length;i+=3){let x=P[i]-c[0],y=P[i+1]-c[1];if(m.t==='sc'){x*=a;y*=a}else[x,y]=[x*co-y*si,x*si+y*co];s.p[i]=c[0]+x;s.p[i+1]=c[1]+y}if(m.t==='sc'){s.w=o.w*a;if(o.iw){s.iw=o.iw*a;s.ih=o.ih*a}}else{if(s.k==='i'){const x=P[0]+o.iw/2-c[0],y=P[1]+o.ih/2-c[1];s.p[0]=c[0]+x*co-y*si-o.iw/2;s.p[1]=c[1]+x*si+y*co-o.ih/2}if(s.k==='i'||s.k==='t')s.r=(o.r||0)+a}s.bb=null}}

async function syncNow(){
 const url=$('#davurl').value.trim(),user=$('#davuser').value.trim(),pass=$('#davpass').value;
 S.sync={url,user,pass};save();

 const auth='Basic '+btoa(unescape(encodeURIComponent(user+':'+pass)));
 try{await fetch(url,{method:'PUT',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify(data)});
  const r=await fetch(url,{headers:{Authorization:auth}});if(r.ok){const remote=await r.json();if(remote&&remote.stamp>=(S.lastStamp||0)){S.lastStamp=remote.stamp;Object.assign(S,{folders:remote.folders||[],notes:remote.notes||[]});open(S.cur||S.notes[0].id)}}

 }catch(e){alert('تعذّرت المزامنة مع الخادم')}
}

async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}
